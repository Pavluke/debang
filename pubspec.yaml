name: debang
description: Enhances Dart/Flutter null handling by requiring assertions for non-null values. Provides informative errors, logging observers, and filtered stack traces for better debugging.
version: 1.0.2
repository: https://github.com/pavluke/debang
homepage: https://github.com/pavluke/debang
issue_tracker: https://github.com/pavluke/debang/issues

topics:
  - null-safety
  - exception-handling
  - debugging
  - error-logging
  - observability

environment:
  sdk: ^3.5.0

